# Server Configuration
server.port=8080
spring.application.name=test-automation

# Node Bridge Configuration
node.bridge.timeout-seconds=30
node.bridge.scripts-dir=node-runner

# Test Configuration
test.output-dir=node-runner/generated-tests

# LLM API Configuration
llm.api.base-url=https://generativelanguage.googleapis.com
llm.api.key=${LLM_API_KEY:}
llm.api.model=gemini-1.5-flash
llm.api.timeout-seconds=20
llm.api.max-retries=3

# Logging Configuration
logging.level.com.smartautomation=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.reactive.function.client=WARN

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration (if needed)
# cors.allowed-origins=http://localhost:5173,http://localhost:3000
